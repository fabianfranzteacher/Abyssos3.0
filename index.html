<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABYSSOS – Notprotokoll</title>
<style>
:root{
  --bg:#03121a; --bg2:#06202c; --panel:#0a2b3a; --panel2:#0d3546;
  --line:#16536b; --txt:#dff3fb; --dim:#8fc0d4;
  --cy:#31e0d8; --cy2:#17b6c9; --warn:#ffb648; --bad:#ff6b6b; --ok:#5ce08a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#0a3040 0%,#03121a 60%);min-height:100vh}
#app{max-width:880px;margin:0 auto;padding:12px 16px 60px}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.2}
h4{font-size:1rem;color:var(--cy);margin-top:16px}
h1{font-size:1.8rem;letter-spacing:.08em}
h2{font-size:1.25rem;color:var(--cy)}
p{margin:.5em 0}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)}
.center{text-align:center}

/* HUD */
#hud{position:sticky;top:0;z-index:20;
  background:rgba(3,18,26,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:8px 16px}
#hudIn{display:flex;gap:10px;align-items:center;max-width:880px;margin:0 auto}
@media (max-width:560px){ #hudIn{gap:6px} #hud .cell{font-size:.7rem} #hLvlCell{display:none}
  #hudIn .btn.small{padding:7px 10px;font-size:.82rem} .dots{gap:4px} .dot{width:9px;height:9px} }
#hud .cell{font-family:var(--mono);font-size:.82rem;color:var(--dim);white-space:nowrap}
#hud .val{color:var(--cy);font-size:1.05rem}
#hud .val.low{color:var(--bad)}
#hud .spacer{flex:1}
.dots{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;border:1px solid var(--line);background:#062130}
.dot.on{background:var(--cy);border-color:var(--cy);box-shadow:0 0 8px var(--cy2)}

.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0;overflow:hidden}
.hero{height:150px;margin:-16px -16px 14px;background-size:cover;background-position:center;
  position:relative;border-bottom:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(4,22,31,.30) 0%,rgba(9,40,54,.80) 65%,var(--panel) 100%)}
.hero.gross{height:230px}
@media (max-width:520px){ .hero{height:108px} .hero.gross{height:150px} }
@media print{ .hero{display:none} }
.panel.quiet{background:#072430}
.tag{display:inline-block;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;
  text-transform:uppercase;color:#04222c;background:var(--cy);padding:3px 9px;border-radius:99px}
.tag.ghost{background:none;color:var(--dim);border:1px solid var(--line)}
.story{border-left:3px solid var(--cy2);padding-left:12px;color:#bfe6f2;font-style:italic}

button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-block;background:var(--cy);color:#03202a;border:none;border-radius:10px;
  padding:13px 20px;font-weight:700;min-height:48px;letter-spacing:.02em}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--cy);border:1px solid var(--line)}
.btn.small{padding:9px 14px;min-height:40px;font-size:.9rem}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}

/* Aufgaben */
.q{background:#062532;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.q .num{font-family:var(--mono);color:var(--cy2);font-size:.8rem}
.chip{display:inline-block;background:#0b3446;border:1px solid var(--line);border-radius:9px;
  padding:9px 14px;margin:4px 5px 0 0;min-height:42px;font-family:var(--mono)}
.chip.sel{background:var(--cy);color:#03202a;border-color:var(--cy);font-weight:700}
.chip.small{padding:6px 10px;min-height:0;font-size:.85rem}
.word{display:inline-block;padding:3px 4px;border-radius:6px;border:1px dashed transparent;margin:1px 0}
.word.click{cursor:pointer;border-color:#14485c}
.word.sel{background:var(--warn);color:#241500;font-weight:700;border-color:var(--warn)}
.gap{display:inline-block;width:16px;height:22px;vertical-align:-4px;border-radius:4px;
  border:1px dashed #1b607a;margin:0 1px;cursor:pointer;text-align:center;line-height:20px}
.gap.on{background:var(--warn);border-color:var(--warn);color:#241500;font-weight:900}
.slot{display:inline-block;min-width:110px;padding:2px 10px;border-bottom:2px solid var(--cy2);
  text-align:center;font-weight:700;color:var(--cy)}
.slot.empty{color:#2d7d92}
.pair{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:.92rem}
.pair .x{color:var(--bad);cursor:pointer;padding:0 6px}
.card{background:#0b3446;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
.card.used{opacity:.35}
.kz{font-family:var(--mono);color:var(--cy);font-weight:700}
.msg{margin:10px 0;padding:11px 13px;border-radius:10px;font-size:.95rem}
.msg.bad{background:#3a1420;border:1px solid #6b2233;color:#ffc9cf}
.msg.ok{background:#0d3a28;border:1px solid #1d6b48;color:#c6f5db}
.msg.info{background:#08303f;border:1px solid var(--line);color:#cfe9f4}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.fade{animation:fd .35s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
ul{padding-left:20px}li{margin:.25em 0}
input[type=text]{background:#062532;border:1px solid var(--line);border-radius:10px;
  color:var(--txt);padding:12px;font-size:1.05rem;width:100%;max-width:320px;font-family:var(--mono)}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:8px 0}
td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.npc{display:flex;gap:12px;align-items:flex-start;background:#07303f;border:1px solid var(--line);
  border-radius:12px;padding:12px;margin:10px 0}
.npc svg{flex:0 0 auto}
.npc .txt{flex:1;min-width:0}
.npc .nm{font-family:var(--mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cy)}
.warn{background:#3b2a08;border:1px solid #7a5a12;color:#ffe2ad}
.note{display:inline-block;font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:99px}
.note.gut{background:#0d3a28;color:#7ef0ae;border:1px solid #1d6b48}
.note.ok{background:#2c3208;color:#e3f08a;border:1px solid #63701a}
.note.uebung{background:#3a1420;color:#ffc9cf;border:1px solid #6b2233}
.punkte{font-family:var(--mono);font-size:2.6rem;color:var(--cy);line-height:1}
.lehrer{background:#0b1f12}
@media print{body{background:#fff;color:#000}.panel{border:1px solid #999;background:#fff}#hud{display:none}}
</style>
</head>
<body>
<div id="hud" style="display:none"><div id="hudIn">
  <div class="cell">RESERVE<br><span class="val" id="hTime">--:--</span></div>
  <div class="cell">CHIPS<br><span class="val" id="hChips">0</span></div>

  <div class="dots" id="hDots"></div>
  <button class="btn ghost small" id="hReset" title="Spiel abbrechen">Abbruch</button>
</div></div>
<div id="app"></div>

/* ---------- Variante und Ziehung ---------- */
function variante(){
  let v=""; try{ v=(new URLSearchParams(location.search).get("v")||"").toLowerCase(); }catch(e){}
  return ["a","b","c"].includes(v)?v:"a";
}
function rng(seed){ let t=seed>>>0; return ()=>{ t+=0x6D2B79F5; let x=Math.imul(t^t>>>15,1|t);
  x^=x+Math.imul(x^x>>>7,61|x); return ((x^x>>>14)>>>0)/4294967296; }; }
function mische(arr,r){ const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function saat(M){ const v=variante();
  return (v.charCodeAt(0)*7919 + M.id.split("").reduce((a,c)=>a+c.charCodeAt(0),0)*31)>>>0; }

const _cache={};
function DAT(M){
  const k=M.id+"_"+variante();
  if(_cache[k]) return _cache[k];
  const r=rng(saat(M));
  let d;
  const vi=["a","b","c"].indexOf(variante());
  if(M.type==="choice"){ d={lines:mische(M.pool,r).slice(0,M.zieh), options:M.optionen}; }
  else if(M.type==="find"){ d=M.pool[vi%M.pool.length]; }
  else if(M.type==="commas"){ d={sentences:mische(M.pool,r).slice(0,M.zieh)}; }
  else if(M.type==="swap"){ d=M.pool[vi%M.pool.length]; }
  else if(M.type==="order"){
    d={items:M.gruppen.map(g=>{ const k=M.pool.filter(x=>x.gruppe===g); return k[Math.floor(r()*k.length)]; })}; }
  else if(M.type==="gaps"){
    /* Zugeständnis und Entkräftung gehören inhaltlich zusammen und werden
       deshalb mit demselben Index gezogen. */
    let paar=0;
    const it=M.gruppen.map(g=>{
      const k=M.pool.filter(x=>x.gruppe===g);
      if(g==="zugestehen"){ paar=Math.floor(r()*k.length); return k[paar]; }
      if(g==="entkraeften") return k[paar%k.length];
      return k[Math.floor(r()*k.length)];
    });
    d={items:it.map((x,i)=>i===0?Object.assign({},x,{pre:M.vorspann}):x)}; }
  else if(M.type==="match"){
    const paare=mische(M.pool,r).slice(0,M.zieh);
    const rechts=mische(paare.map((p,i)=>i),r);
    d={ left:paare.map(p=>p.l), right:rechts.map(i=>paare[i].r),
        map:Object.fromEntries(paare.map((p,i)=>[i,rechts.indexOf(i)])) }; }
  _cache[k]=d; return d;
}
function FIN(){ const r=rng(rng(variante().charCodeAt(0)*104729)()*1e9);
  return FINALE_POOL[Math.floor(r()*FINALE_POOL.length)]; }
function tippText(M,i){ const t=M.tipps[i]; return typeof t==="function"?t(DAT(M)):t; }

const STUFE_TXT=["vage","deutlich","fast die Lösung"];
function tippAnbieten(M){
  const u=S.tipps[M.id]||0, st=ST();
  if(u>=M.tipps.length){ say("Mehr habe ich nicht. Wenn ihr feststeckt, arbeitet weiter – der Filter meldet sich von allein.","info"); return; }
  const preis=st.tippKosten[u];
  const rest=Math.max(0,S.left);
  const warnung = preis>0 && rest<preis*3
    ? `<p class="msg warn" style="margin:8px 0 0">Achtung: Eure Reserve beträgt nur noch ${fmt(rest)}. Dieser Hinweis kostet davon ${preis} Sekunden.</p>` : "";
  say(npcBox(`<p style="margin-top:0">Hinweis ${u+1} von 3 – <b>${STUFE_TXT[u]}</b>.
     ${preis===0?"Der kostet euch nichts.":`Er kostet <b>${preis} Sekunden</b> Reserve.`}
     Je eindeutiger der Hinweis, desto teurer wird er.</p>${warnung}
     <p class="row"><button class="btn small" id="tjaa">Ja, Hinweis geben</button>
     <button class="btn ghost small" id="tnee">Lieber selbst versuchen</button></p>`),"info");
  $("tjaa").onclick=()=>{
    S.tipps[M.id]=u+1; if(preis) costTime(preis); save();
    say(npcBox(`<p style="margin-top:0"><b>Hinweis ${u+1} von 3</b></p><p>${tippText(M,u)}</p>`),"info");
    const b=$("tipp"); if(b) b.textContent = (u+1)>=3 ? "Keine Hinweise mehr" : "Hinweis "+(u+2)+" von 3 anfordern";
  };
  $("tnee").onclick=()=>{ say(npcBox("<p style='margin-top:0'>Gut. Ich halte mich raus.</p>"),"info"); };
}

function anzahlHinweis(M){
  const D=DAT(M);
  if(M.type==="find") return `Es sind <b>${D.errors.length}</b>.`;
  if(M.type==="commas") return `Insgesamt sind es <b>${D.sentences.reduce((a,x)=>a+x.gaps.length,0)}</b>.`;
  return "";
}
function initWork(M){
  switch(M.type){
    case "choice": return {ans:DAT(M).lines.map(()=>null)};
    case "find": return {sel:[]};
    case "commas": return {sel:DAT(M).sentences.map(()=>[])};
    case "gaps": return {ans:DAT(M).items.map(()=>null)};
    case "match": return {pairs:{}, act:null};
    case "order": return {built:DAT(M).items.map(()=>[]), pool:DAT(M).items.map(it=>{
      const idx=it.loesung.map((x,i)=>i);
      for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
      return idx;
    })};
    case "swap": return {ans:DAT(M).items.map(()=>null)};
  }
  return {};
}

function renderBody(M){
  const W=S.work[M.id], B=$("body");
  if(M.type==="choice"){
    B.innerHTML=DAT(M).lines.map((l,i)=>`
      <div class="q"><span class="num">FUNKSPRUCH ${i+1}</span><br>
      ${esc(l.pre)} <span id="sl${i}" class="slot ${W.ans[i]?"":"empty"}">${W.ans[i]||"?"}</span> ${esc(l.post)}<br>
      ${DAT(M).options.map(o=>`<button class="chip ${W.ans[i]===o?"sel":""}" data-i="${i}" data-o="${o}">${o}</button>`).join("")}
      </div>`).join("");
    B.onclick=e=>{ const b=e.target.closest("[data-o]"); if(!b)return;
      W.ans[+b.dataset.i]=b.dataset.o; save(); renderBody(M); };
  }
  else if(M.type==="find"){
    B.innerHTML=`<div class="q" style="font-size:1.05rem;line-height:2">`+
      DAT(M).tokens.map((t,i)=>`<span class="word click ${W.sel.includes(i)?"sel":""}" data-i="${i}">${esc(t)}</span>`).join(" ")+
      `</div><p class="dim mono" style="font-size:.85rem">markiert: ${W.sel.length}${ST().geruest?"/"+DAT(M).errors.length:""}</p>`;
    B.onclick=e=>{ const w=e.target.closest("[data-i]"); if(!w)return; const i=+w.dataset.i;
      const p=W.sel.indexOf(i); if(p<0){ if(ST().geruest&&W.sel.length>=DAT(M).errors.length){ say("Der Speicher nimmt nicht mehr Markierungen an. Hebt eine wieder auf.","info"); return; } W.sel.push(i);} else W.sel.splice(p,1);
      save(); renderBody(M); };
  }
  else if(M.type==="commas"){
    B.innerHTML=DAT(M).sentences.map((s,si)=>`
      <div class="q"><span class="num">BEFEHL ${si+1}</span><br>`+
      s.words.map((w,wi)=>esc(w)+(wi<s.words.length-1?`<span class="gap ${W.sel[si].includes(wi)?"on":""}" data-s="${si}" data-w="${wi}">${W.sel[si].includes(wi)?",":""}</span>`:"")).join(" ")+
      `</div>`).join("")+
      `<p class="dim mono" style="font-size:.85rem">gesetzt: ${W.sel.reduce((a,b)=>a+b.length,0)}${ST().geruest?"/"+DAT(M).sentences.reduce((a,x)=>a+x.gaps.length,0):""}</p>`;
    B.onclick=e=>{ const g=e.target.closest("[data-w]"); if(!g)return;
      const si=+g.dataset.s, wi=+g.dataset.w, arr=W.sel[si], p=arr.indexOf(wi);
      if(p<0) arr.push(wi); else arr.splice(p,1); save(); renderBody(M); };
  }
  else if(M.type==="gaps"){
    B.innerHTML=DAT(M).items.map((it,i)=>`
      <div class="q">${it.pre?`<p class="dim" style="font-size:.93rem">${esc(it.pre)}</p>`:""}
      ${ST().geruest?`<p><span class="tag ghost">Aufgabe der Lücke: ${esc(it.funktion)}</span></p>`:""}
      <p style="font-size:1.05rem"><span class="slot ${W.ans[i]===null?"empty":""}">${W.ans[i]!==null?esc(it.options[W.ans[i]]):"?"}</span>${esc(it.sentence[1])}</p>
      ${it.options.map((o,oi)=>`<button class="chip ${W.ans[i]===oi?"sel":""}" data-i="${i}" data-o="${oi}">${esc(o)}</button>`).join("")}
      </div>`).join("");
    B.onclick=e=>{ const b=e.target.closest("[data-o]"); if(!b)return;
      W.ans[+b.dataset.i]=+b.dataset.o; save(); renderBody(M); };
  }
  else if(M.type==="order"){
    B.innerHTML=DAT(M).items.map((it,i)=>{
      const built=W.built[i];
      const satz=built.length?built.map(k=>esc(it.loesung[k])).join(" ").replace(/ ,/g,",")
        :'<span class="dim">noch nichts gesetzt</span>';
      return `<div class="q"><span class="num">BEFEHL ${i+1}${ST().geruest?" · "+esc(it.art):""}</span>
        <p style="font-size:1.05rem;min-height:1.6em">${satz}</p>
        <div>${W.pool[i].filter(k=>!built.includes(k)).map(k=>
          `<button class="chip" data-o="${i}" data-k="${k}">${esc(it.loesung[k])}</button>`).join("")}</div>
        ${built.length?`<p><button class="btn ghost small" data-undo="${i}">Letzten zurück</button></p>`:""}
      </div>`;}).join("");
    B.onclick=e=>{
      const u=e.target.closest("[data-undo]");
      if(u){ W.built[+u.dataset.undo].pop(); save(); return renderBody(M); }
      const c=e.target.closest("[data-k]");
      if(c){ W.built[+c.dataset.o].push(+c.dataset.k); save(); return renderBody(M); }
    };
  }
  else if(M.type==="swap"){
    const t=DAT(M).text.map((seg,i)=>{
      if(i%2===0) return esc(seg);
      const k=(i-1)/2, a=W.ans[k];
      return a===null?`<span class="word sel">${esc(seg)}</span>`
        :`<s class="dim">${esc(seg)}</s> <b style="color:var(--ok)">${esc(DAT(M).items[k].options[a])}</b>`;
    }).join("");
    B.innerHTML=`<div class="q" style="line-height:1.9">${t}</div>`+
      DAT(M).items.map((it,k)=>`<div class="q"><span class="num">ERSETZEN ${k+1}</span>
        <p><span class="word sel">${esc(it.alt)}</span> &nbsp;→&nbsp;
        <span class="slot ${W.ans[k]===null?"empty":""}">${W.ans[k]!==null?esc(it.options[W.ans[k]]):"?"}</span></p>
        ${it.options.map((o,oi)=>`<button class="chip ${W.ans[k]===oi?"sel":""}" data-i="${k}" data-o="${oi}">${esc(o)}</button>`).join("")}
      </div>`).join("");
    B.onclick=e=>{ const b=e.target.closest("[data-o]"); if(!b)return;
      W.ans[+b.dataset.i]=+b.dataset.o; save(); renderBody(M); };

  else if(M.type==="match"){
    const taken=Object.values(W.pairs);
    B.innerHTML=`
      <p class="dim mono" style="font-size:.82rem">EINWÄNDE DER BODENSTATION</p>
      ${DAT(M).left.map((l,i)=>`<div class="card ${W.pairs[i]!==undefined?"used":""} ${W.act===i?"":""}" data-l="${i}"
        style="${W.act===i?"border-color:var(--cy);box-shadow:0 0 0 2px var(--cy2) inset":""}">
        <b class="kz">${String.fromCharCode(65+i)}</b> ${esc(l)}</div>`).join("")}
      <p class="dim mono" style="font-size:.82rem;margin-top:14px">VORBEREITETE ANTWORTEN</p>
      ${DAT(M).right.map((r,j)=>`<div class="card ${taken.includes(j)?"used":""}" data-r="${j}"><b class="kz">${j+1}</b> ${esc(r)}</div>`).join("")}
      <p class="dim mono" style="font-size:.85rem;margin-top:12px">ZUORDNUNG</p>
      ${Object.keys(W.pairs).length?Object.entries(W.pairs).map(([l,r])=>`<div class="pair"><span class="chip small">${String.fromCharCode(65+ +l)} → ${+r+1}</span><span class="x" data-del="${l}">aufheben ✕</span></div>`).join(""):'<p class="dim">noch keine</p>'}`;
    B.onclick=e=>{
      const d=e.target.closest("[data-del]"); if(d){ delete W.pairs[d.dataset.del]; save(); return renderBody(M); }
      const l=e.target.closest("[data-l]"); if(l){ const i=+l.dataset.l; if(W.pairs[i]!==undefined) delete W.pairs[i]; W.act=(W.act===i?null:i); save(); return renderBody(M); }
      const r=e.target.closest("[data-r]"); if(r){ const j=+r.dataset.r;
        if(W.act===null||W.act===undefined){ say("Tippt zuerst einen Einwand an.","info"); return; }
        if(Object.values(W.pairs).includes(j)){ say("Diese Antwort ist schon vergeben.","info"); return; }
        W.pairs[W.act]=j; W.act=null; save(); return renderBody(M); }
    };
  }
}

function checkModul(M){
  const W=S.work[M.id]; let wrong=0, complete=true;
  if(M.type==="choice"){ DAT(M).lines.forEach((l,i)=>{ if(W.ans[i]===null) complete=false; else if(W.ans[i]!==l.correct) wrong++; }); }
  if(M.type==="find"){
    if(!W.sel.length) complete=false;
    else if(ST().geruest){ if(W.sel.length<DAT(M).errors.length) complete=false; else wrong=W.sel.filter(i=>!DAT(M).errors.includes(i)).length; }
    else wrong=W.sel.filter(i=>!DAT(M).errors.includes(i)).length + DAT(M).errors.filter(i=>!W.sel.includes(i)).length; }
  if(M.type==="commas"){ let set=0; DAT(M).sentences.forEach((s,si)=>{ set+=W.sel[si].length;
      wrong+=W.sel[si].filter(w=>!s.gaps.includes(w)).length + s.gaps.filter(g=>!W.sel[si].includes(g)).length; });
    if(set===0) complete=false; }
  if(M.type==="gaps"){ DAT(M).items.forEach((it,i)=>{ if(W.ans[i]===null) complete=false; else if(W.ans[i]!==it.correct) wrong++; }); }
  if(M.type==="order"){ DAT(M).items.forEach((it,i)=>{
      const b=W.built[i];
      if(b.length<it.loesung.length){ complete=false; return; }
      if(b.some((k,pos)=>k!==pos)) wrong++; }); }
  if(M.type==="swap"){ DAT(M).items.forEach((it,i)=>{ if(W.ans[i]===null) complete=false;
      else if(W.ans[i]!==it.correct) wrong++; }); }
  if(M.type==="match"){ const n=Object.keys(W.pairs).length; if(n<4) complete=false;
    Object.entries(W.pairs).forEach(([l,r])=>{ if(DAT(M).map[l]!==+r) wrong++; }); }

  if(!complete){ say("Der Filter braucht <b>alle</b> Eingaben, bevor er prüft.","info"); shake(); return; }
  if(wrong===0){ solveModul(M,false); return; }
  const st=ST();
  S.fails[M.id]=(S.fails[M.id]||0)+1; costTime(st.fehler); save(); shake();
  const f=S.fails[M.id];
  let extra="";
  if(f>=st.notfallAb) extra=`<p><b>Ich schalte einen Hinweis frei, kostenlos:</b> ${tippText(M,1)}</p>`;
  if(f>=st.brueckeAb) extra+="<p>Wenn ihr nicht weiterkommt: Ich kann den Filter <b>überbrücken</b>. Dann gibt es keinen Datenchip, aber ihr kommt weiter.</p>";
  if(f===st.brueckeAb) screenModul();
  say(npcBox(`<p style="margin-top:0">${spruch(NPC.fehler)}</p>
    <p>Der Filter beanstandet <b>${wrong}</b> Stelle${wrong>1?"n":""}. Das kostet ${st.fehler} Sekunden.</p>${extra}`),"bad");
}

function solveModul(M,skipped){
  S.solved.push(M.id); if(skipped){ S.skipped=S.skipped||[]; S.skipped.push(M.id); }
  save(); bodyBild(M.bild);
  $("app").innerHTML=`
  <div class="panel fade" id="card">
    <div class="hero" style="background-image:url(img/${M.bild}.webp)"></div>
    <div class="tag">System ${M.nr} ${skipped?"überbrückt":"online"}</div>

    ${skipped?"":npcBox(`<p style="margin-top:0">${spruch(NPC.gut)}</p>`)}
    <p>Kennzahl dieses Systems: <span class="kz" style="font-size:2rem">${M.kz}</span></p>
    <p class="dim">Notiert sie – am Ende zählt die Reihenfolge.</p>
    <hr>
    ${skipped?"":`<div class="tag ghost">Freiwillig · 1 Datenchip</div>
    <p style="margin-top:10px"><b>${M.bonus.frage}</b></p>
    <div id="bo">${M.bonus.optionen.map((o,i)=>`<button class="chip" data-b="${i}">${esc(o)}</button>`).join("")}</div>`}
    <div id="msg" class="msg info" style="display:none"></div>
    <p class="row" style="margin-top:14px"><button class="btn" id="next">Weiter</button></p>
  </div>`;
  const bo=$("bo");
  if(bo) bo.onclick=e=>{ const b=e.target.closest("[data-b]"); if(!b||S.bonus.includes(M.id))return;
    S.bonus.push(M.id);
    if(+b.dataset.b===M.bonus.correct){ S.chips++; S.bonusOk=S.bonusOk||[]; S.bonusOk.push(M.id); say("<b>Datenchip gesichert.</b> "+M.bonus.erklaerung,"ok"); }
    else say("<b>Kein Chip.</b> "+M.bonus.erklaerung,"bad");
    save(); paintHud(); [...bo.children].forEach(c=>c.disabled=true); };
  $("next").onclick=()=>{ S.screen=(S.solved.length>=MODS().length)?"code":"modul"; save(); render(); };
}

    <p><b>Tippt die Begründungen in der richtigen Reihenfolge an.</b></p>
    ${W.show.map(i=>{const c=FIN().cards[i];return `<div class="card ${W.order.includes(i)?"used":""}" data-c="${i}">
      <span class="kz">${W.order.includes(i)?"#"+(W.order.indexOf(i)+1):"·"}</span> ${esc(c.text)}</div>`;}).join("")}

  $("app").onclick=e=>{ const c=e.target.closest("[data-c]"); if(!c)return; const i=+c.dataset.c;
    if(W.order.includes(i))return; W.order.push(i); save(); screenFinale(); };
  $("undo").onclick=()=>{ W.order.pop(); save(); screenFinale(); };
  $("tipp").onclick=()=>{ costTime(60);
    say("Das schwächste Argument ist eine reine Meinung ohne <i>weil</i>. Das stärkste räumt einen Einwand ein und widerlegt ihn.","info"); };
  $("go").onclick=()=>{
    if(W.order.length<5){ say("Es fehlen noch Begründungen.","info"); shake(); return; }
    const ok=W.order.every((c,pos)=>FIN().cards[c].rang===pos+1);
    if(ok){ S.over=true; S.screen="ende"; save(); render(); }
    else { S.finaleFails=(S.finaleFails||0)+1; costTime(ST().fehler); shake();
      say(npcBox("<p style='margin-top:0'>Die Bodenstation antwortet: „Eure Reihenfolge überzeugt nicht. Fangt mit der schwächsten Begründung an.“</p>"),"bad"); }
  };
}

/* ---------- ENDE ---------- */
function bewerte(mid){
  if((S.skipped||[]).includes(mid)) return {k:"uebung", t:"Übungsbedarf"};
  const f=S.fails[mid]||0, t=S.tipps[mid]||0, bonus=(S.bonusOk||[]).includes(mid);
  const last=f*2+t*2+(bonus?0:1);
  if(last<=1) return {k:"gut", t:"sicher"};
  if(last<=4) return {k:"ok", t:"solide"};
  return {k:"uebung", t:"Übungsbedarf"};
}

function punkte(){
  const st=ST(), mods=MODS();
  const zeit=Math.max(0,S.left)*2;
  const chips=S.chips*150;
  const eigen=mods.filter(m=>S.solved.includes(m.id)&&!(S.skipped||[]).includes(m.id)).length*100;
  const roh=zeit+chips+eigen;
  return { zeit, chips, eigen, roh, faktor:st.faktor, gesamt:Math.round(roh*st.faktor) };
}

function speicher(){
  const teile=[];
  const hat=id=>MODS().some(m=>m.id===id);
  if(hat("protokoll")){
    const D=DAT(MODULES.find(m=>m.id==="protokoll"));
    const satz=D.text.map((t,i)=>i%2?`<b>${esc(D.items[(i-1)/2].options[D.items[(i-1)/2].correct])}</b>`:esc(t)).join("");
    teile.push(`<h4>So klingt das Protokoll ohne Umgangssprache</h4><p>${satz}</p>
      <p class="dim" style="font-size:.9rem">${D.items.map(it=>esc(it.alt)+" → "+esc(it.options[it.correct])).join(" · ")}</p>`);
  }
  if(hat("leitung")){
    const D=DAT(MODULES.find(m=>m.id==="leitung"));
    teile.push(`<h4>Nebensätze, die ihr gebaut habt</h4><ul>${
      D.items.map(it=>`<li>${esc(it.loesung.join(" ").replace(/ ,/g,","))}.<br><span class="dim" style="font-size:.9rem">${esc(it.art)}</span></li>`).join("")}</ul>`);
  }
  if(hat("funk")){
    const D=DAT(MODULES.find(m=>m.id==="funk"));
    teile.push(`<h4>Formulierungen nach ihrer Aufgabe</h4><ul>${
      D.items.map(it=>`<li><b>${esc(it.options[it.correct])}</b> – ${esc(it.funktion)}</li>`).join("")}</ul>`);
  }
  if(hat("gegen")){
    teile.push(`<h4>So entkräftet man einen Einwand</h4>
      <p>Erst zugestehen, dann dagegenhalten:</p>
      <p class="mono" style="font-size:.95rem">Sicherlich … <b>Dennoch</b> …<br>Das stimmt … <b>Allerdings</b> …<br>… wäre denkbar. <b>Jedoch</b> …</p>`);
  }
  if(!teile.length) return "";
  return `<hr><h3>Für die nächste Erörterung</h3>
    <p class="dim" style="font-size:.95rem">Fotografiert diesen Abschnitt ab oder druckt ihn aus – das sind die Formulierungen, die ihr gerade selbst zusammengesetzt habt.</p>
    <div class="panel quiet">${teile.join("")}</div>`;
}

  const gut=bereiche.filter(x=>x.b.k==="gut"), uebung=bereiche.filter(x=>x.b.k==="uebung");

        <td class="mono dim" style="white-space:nowrap">${(S.skipped||[]).includes(x.m.id)?"überbrückt":`${S.fails[x.m.id]||0} F · ${S.tipps[x.m.id]||0} H`}</td></tr>`).join("")}
      <tr><td>Argumente nach Stärke ordnen</td>

/* ---------- LEHRKRAFT ---------- */

  gegen:"Einwand entkräften"
};
/* geschätzte Minuten je System, für die Dauerangabe */
const DAUER={ schleuse:7, archiv:7, druck:7, leitung:11, funk:8, protokoll:10, gegen:8 };

function screenLehrer(){
  document.getElementById("hud").style.display="none"; bodyBild(null);
  const L=(M)=>{
    if(M.type==="choice") return DAT(M).lines.map((l,i)=>(i+1)+": "+l.correct).join(" · ");

    if(M.type==="commas") return DAT(M).sentences.map((s,i)=>(i+1)+": nach „"+s.gaps.map(g=>s.words[g]).join("“ und „")+"“").join(" · ");
    if(M.type==="gaps") return DAT(M).items.map((it,i)=>(i+1)+": "+it.options[it.correct]).join(" · ");
    if(M.type==="match") return Object.entries(DAT(M).map).map(([l,r])=>String.fromCharCode(65+ +l)+"→"+(r+1)).join(" · ");
    if(M.type==="order") return DAT(M).items.map((it,i)=>(i+1)+": "+it.loesung.join(" ").replace(/ ,/g,",")).join("<br>");

  /* Auswahl, Link und Dauer live berechnen */

    const q=[]; if(!alle) q.push("sys="+nrs.join(""));

    const url=basis+(q.length?"?"+q.join("&"):"");
    $("lnk").textContent=nrs.length?url:"(mindestens ein System auswählen)";
    const min=mods.reduce((a,m)=>a+DAUER[m.id],0)+8;

    $("kcode").textContent=mods.map(m=>m.kz).join("")||"–";

  $("test").onclick=()=>{

    try{ localStorage.removeItem(KEY); }catch(e){}
    location.href=basis+(nrs.length===MODULES.length?"":"?sys="+nrs.join(""));
  };
  aktualisiere();
}
